# AuraDrop V25 COTURN Configuration
# Production TURN / STUN relay server configuration

# Network listening ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=0
alt-tls-listening-port=0

# Bind to all interfaces
listening-ip=0.0.0.0

# Dynamic relay port range (RFC 5766 recommended range)
min-port=49152
max-port=65535

# Realm and Authentication
realm=auradrop.network
use-auth-secret
static-auth-secret=auradrop-production-coturn-shared-secret-2026

# Use long-term credential mechanism (HMAC-SHA1 time-limited tokens)
lt-cred-mech

# Message Integrity and Fingerprint check
fingerprint

# Bandwidth and Quota Limits (Prevents DoS while allowing high-speed transfers)
max-bps=0
bps-capacity=0
total-quota=0
user-quota=0

# Security and Isolation
no-multicast-peers
no-cli
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1

# Logging
verbose
log-file=stdout
simple-log
